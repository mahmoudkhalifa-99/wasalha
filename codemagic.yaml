workflows:
  wasalha-android:
    name: وصلها - Android Build
    instance_type: linux_x2
    max_build_duration: 30
    environment:
      node: 22
      java: 21
      vars:
        # ضيف هنا مفتاح GEMINI API الخاص بيك من صفحة الـ Environment variables
        # في إعدادات الـ workflow على موقع Codemagic (خليه Secret)
        GEMINI_API_KEY: $GEMINI_API_KEY
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: تثبيت الباكدجات
        script: |
          npm install --no-audit --no-fund
      - name: بناء الويب (Vite build)
        script: |
          npm run build
      - name: مزامنة Capacitor مع مشروع Android
        script: |
          npx cap sync android
      - name: بناء ملف APK (Debug - يتثبت على أي جهاز أندرويد مباشرة)
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true
